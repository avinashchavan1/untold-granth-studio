<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Storyreel Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-parchment text-ink dark:bg-night-950 dark:text-parchment">
    <div id="root">
      <!-- first-paint loader (React replaces it); styles inline so it shows before any CSS/JS arrives -->
      <div class="bl-w" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,sans-serif;color:#6b6480">
        <style>
          .bl-e{position:relative;width:64px;height:64px;border-radius:50%;background:#fff;border:6px solid #14123a;display:inline-block;margin:0 6px}
          .bl-p{position:absolute;width:26px;height:26px;border-radius:50%;background:#14123a;left:13px;top:13px;animation:bl-look 2.4s ease-in-out infinite}
          @keyframes bl-look{0%,100%{transform:translate(-9px,-6px)}30%{transform:translate(9px,-6px)}55%{transform:translate(8px,8px)}80%{transform:translate(-8px,7px)}}
          .bl-w{background:#f6f1e6}@media (prefers-color-scheme:dark){.bl-w{background:#0b0a18;color:#c9c2b0}}
          @media (prefers-reduced-motion:reduce){.bl-p{animation:none}}
        </style>
        <div><span class="bl-e"><span class="bl-p"></span></span><span class="bl-e"><span class="bl-p"></span></span></div>
        <div style="font-weight:600;font-size:14px">Opening the studio…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
